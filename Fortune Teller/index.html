<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursed Constellations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>Reveal Your Fate</h1>

    <!-- Mystical Input Form -->
    <form id="fateForm">
        <div class="form-group">
            <label for="userName">Mortal Name</label>
            <input type="text" id="userName" placeholder="Enter your name..."  autocomplete="off">
        </div>

        <div class="form-group">
            <label for="zodiacSign">Zodiac Alignment</label>
            <select id="zodiacSign" required>
                <option value="" disabled selected>Choose your sign...</option>
                <option value="Aries">Aries (The Ram)</option>
                <option value="Taurus">Taurus (The Bull)</option>
                <option value="Gemini">Gemini (The Twins)</option>
                <option value="Cancer">Cancer (The Crab)</option>
                <option value="Leo">Leo (The Lion)</option>
                <option value="Virgo">Virgo (The Virgin)</option>
                <option value="Libra">Libra (The Scales)</option>
                <option value="Scorpio">Scorpio (The Scorpion)</option>
                <option value="Sagittarius">Sagittarius (The Archer)</option>
                <option value="Capricorn">Capricorn (The Goat)</option>
                <option value="Aquarius">Aquarius (The Water Bearer)</option>
                <option value="Pisces">Pisces (The Fish)</option>
            </select>
        </div>

        <button type="submit">Consult The Cosmos</button>
    </form>

    <!-- Dedicated Destiny Zone -->
    <div class="destiny-zone" id="destinyZone">
        <h2 class="destiny-title">🔮 The Destiny Zone 🔮</h2>
        <div class="destiny-output" id="destinyOutput">
            <!-- Output dynamic text here -->
        </div>
    </div>
    <!-- <div>
        <h2>Explore The cosmos</h2>
        <input type="text" name="searchInput" id="SearchInput"
         placeholder="Search the archive (try 'wind'...) ">
    </div>
    <input type="button"> -->


    <div id="customModal" class="modal-overlay">
  <div class="modal-box">
    <h2>⚠️ Divine Decree</h2>
    <p id="modalMessage"></p>
    <button onclick="closeModal()">I Obey</button>
  </div>
</div>

    <script src="script.js"></script>
</body>
</html
